[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "quartr"
version = "0.3.6"
dependencies = ["quart==0.23.1", "uvicorn==0.54.0"]
requires-python = ">=3.13"
authors = [{ name = "Cliff Snyder", email = "cliff.snyder@gmail.com" }]
maintainers = [{ name = "Cliff Snyder", email = "cliff.snyder@gmail.com" }]
description = "A quart template app"
readme = "README.md"
license = "MIT"

[project.optional-dependencies]
dev = [
    "black",
    "bump-my-version",
    "isort",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[tool.bumpversion]
current_version = "0.3.6"
commit = true
tag = true
tag_name = "v{new_version}"
message = "Bump version: {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = '^version = "{current_version}"'
replace = 'version = "{new_version}"'
regex = true

[[tool.bumpversion.files]]
filename = ".deploy/quartr/Chart.yaml"

[tool.black]
line-length = 88
target-version = ["py313"]
exclude = "(venv|build)"

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]
line_length = 88
skip = ["venv", "build"]

[tool.mypy]
exclude = ["venv", "build"]

[tool.coverage.run]
omit = ["src/quartr/asgi.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90
